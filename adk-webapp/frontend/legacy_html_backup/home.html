<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alpha Delta Kennel — Dogs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<!-- Feather Icons -->
<script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-expanded="false">
        <i data-feather="menu"></i>
      </button>
      <div class="sidebar-profile fade-in">
        <div class="sidebar-avatar">
          <i data-feather="user"></i>
        </div>
        <div>
          <div class="sidebar-name" id="sidebarName">Welcome</div>
          <div class="sidebar-role" id="sidebarRole"></div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <i data-feather="grid"></i> Dashboard
        </a>
        <a href="home.html" class="active">
          <i data-feather="list"></i> Dogs
        </a>
        <a href="sold.html">
          <i data-feather="tag"></i> Sold
        </a>
        <a href="adopted.html">
          <i data-feather="heart"></i> Adopted
        </a>
        <a href="report.html">
          <i data-feather="file-text"></i> Reports
        </a>
      </nav>
      <button class="sidebar-logout" onclick="logout()">
        <i data-feather="log-out"></i> Log out
      </button>
    </aside>

    <main class="main fade-in-up">
      <h2 class="page-title"><i data-feather="database"></i> Dog Information Database</h2>

      <div id="filterChipHolder"></div>

      <div class="toolbar">
        <div class="search-box">
          <i data-feather="search"></i>
          <input type="text" id="searchInput" placeholder="Search by name, breed, nickname, or microchip...">
        </div>
        <button class="btn btn-primary" id="addBtn" style="width:auto;">
          <i data-feather="plus"></i> Add New Dog
        </button>
      </div>

      <div class="table-scroll-top" id="tableScrollTop"><div class="table-scroll-top-inner" id="tableScrollTopInner"></div></div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Photo</th><th>DogID</th><th>Breed</th><th>Dog Name</th><th>Nick Name</th><th>Gender</th>
              <th>DOB</th><th>Microchip</th><th>Father</th><th>Mother</th><th>Comments</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="dogTableBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">No dogs found.</div>
    </main>
  </div>

  <!-- View Details Modal (read-only, shows full text incl. long comments) -->
  <div class="modal-overlay" id="viewModalOverlay">
    <div class="modal modal-view-wrap">
      <div class="modal-view-row">
        <div class="view-photo-col" id="viewPhotoCol"></div>
        <div class="view-fields-col" id="viewFieldsCol"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="viewCloseBtn" style="flex:none; width:100%;">
          <i data-feather="x"></i> Close
        </button>
      </div>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <form id="dogForm">
        <input type="hidden" id="dogId">
        <div class="field">
          <label>Photo (optional)</label>
          <div style="display:flex; align-items:center; gap:12px;">
            <img id="photoPreview" src="" alt="" title="Click to reposition" style="width:64px; height:64px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,0.2); display:none; cursor:pointer;">
            <div id="photoPlaceholder" style="width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center;">
              <i data-feather="camera" style="color:#fff; opacity:0.7;"></i>
            </div>
            <div style="flex:1;">
              <input type="file" id="photoInput" accept="image/*" style="background:#fff; border-radius:8px; padding:8px;">
              <div id="photoRemoveWrap" style="display:none; margin-top:6px; display:flex; gap:8px;">
                <button type="button" id="photoAdjustBtn" class="btn btn-secondary" style="padding:4px 10px; font-size:12px;">Reposition</button>
                <button type="button" id="photoRemoveBtn" class="btn btn-secondary" style="padding:4px 10px; font-size:12px;">Remove photo</button>
              </div>
            </div>
          </div>

          <!-- Crop / reposition stage -->
          <div id="cropWrap" style="display:none; margin-top:14px;">
            <div id="cropStage" style="position:relative; width:220px; height:220px; margin:0 auto; overflow:hidden; border-radius:16px; background:#0b1a33; touch-action:none; cursor:grab;">
              <img id="cropImage" style="position:absolute; top:0; left:0; transform-origin:0 0; user-select:none; -webkit-user-drag:none; pointer-events:none;">
            </div>
            <div style="display:flex; align-items:center; gap:10px; margin-top:10px; max-width:220px; margin-left:auto; margin-right:auto;">
              <i data-feather="zoom-out" class="icon-sm" style="color:#fff;"></i>
              <input type="range" id="cropZoom" min="100" max="300" value="100" style="flex:1;">
              <i data-feather="zoom-in" class="icon-sm" style="color:#fff;"></i>
            </div>
            <p style="text-align:center; color:rgba(255,255,255,0.7); font-size:11px; margin:6px 0 0;">Drag the photo to reposition it</p>
            <div style="display:flex; gap:10px; margin-top:10px; max-width:220px; margin-left:auto; margin-right:auto;">
              <button type="button" id="cropCancelBtn" class="btn btn-secondary" style="flex:1; padding:8px; font-size:12px;">Cancel</button>
              <button type="button" id="cropApplyBtn" class="btn btn-primary" style="flex:1; padding:8px; font-size:12px;">Use this photo</button>
            </div>
          </div>

          <input type="hidden" id="photoData">
        </div>
        <div class="field"><label>Breed</label><input type="text" id="breed"></div>
        <div class="field"><label>Dog Name</label><input type="text" id="dogname"></div>
        <div class="field"><label>Nick Name</label><input type="text" id="nickname"></div>
        <div class="field">
          <label>Gender</label>
          <select id="gender">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="field"><label>Date of Birth</label><input type="date" id="dob"></div>
        <div class="field"><label>Microchip Number</label><input type="text" id="microchip"></div>
        <div class="field"><label>Father</label><input type="text" id="father"></div>
        <div class="field"><label>Mother</label><input type="text" id="mother"></div>
        <div class="field">
          <label>Status</label>
          <select id="status">
            <option value="active">Active</option>
            <option value="deceased">Deceased</option>
            <option value="sold">Sold</option>
            <option value="adopted">Adopted</option>
          </select>
        </div>
        <div id="dispositionFields" style="display:none;">
          <div class="field"><label id="dispositionDateLabel">Date Sold</label><input type="date" id="dispositionDate"></div>
          <div class="field" id="saleAmountField"><label>Unit Price (AED)</label><input type="text" inputmode="decimal" id="saleAmount" placeholder="0.00 AED"></div>
          <div class="field"><label id="dispositionNameLabel">Buyer's Name</label><input type="text" id="dispositionName"></div>
          <div class="field"><label id="dispositionAddressLabel">Buyer's Address</label><textarea id="dispositionAddress" rows="2"></textarea></div>
          <div class="field"><label id="dispositionContactLabel">Buyer's Contact Details</label><input type="text" id="dispositionContact"></div>
        </div>
        <div class="field"><label>Comments</label><textarea id="comment" rows="3"></textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireLogin();
    renderSidebarProfile();
    const user = getCurrentUser();

    const tbody = document.getElementById('dogTableBody');
    const emptyState = document.getElementById('emptyState');
    const modalOverlay = document.getElementById('modalOverlay');
    const dogForm = document.getElementById('dogForm');
    const statusInput = document.getElementById('status');

    function formatAedAmount(value) {
      const amount = Number(String(value ?? '').replace(/[^0-9.]/g, ''));
      if (!Number.isFinite(amount)) return '';
      return `${new Intl.NumberFormat('en-AE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount)} AED`;
    }

    function updateDispositionFields() {
      const isSold = statusInput.value === 'sold';
      const isAdopted = statusInput.value === 'adopted';
      document.getElementById('dispositionFields').style.display = (isSold || isAdopted) ? 'block' : 'none';
      document.getElementById('saleAmountField').style.display = isSold ? 'block' : 'none';
      document.getElementById('saleAmount').required = isSold;
      const person = isSold ? "Buyer" : "Adopter";
      document.getElementById('dispositionDateLabel').textContent = isSold ? 'Date Sold' : 'Date Adopted';
      document.getElementById('dispositionNameLabel').textContent = `${person}'s Name`;
      document.getElementById('dispositionAddressLabel').textContent = `${person}'s Address`;
      document.getElementById('dispositionContactLabel').textContent = `${person}'s Contact Details`;
      ['dispositionDate', 'dispositionName', 'dispositionAddress', 'dispositionContact'].forEach(id => {
        document.getElementById(id).required = isSold || isAdopted;
      });
    }
    statusInput.addEventListener('change', updateDispositionFields);

    // Read filter params passed from dashboard card links
    const urlParams = new URLSearchParams(window.location.search);
    const statusFilter = urlParams.get('status');   // 'active' | 'deceased'
    const missingFilter = urlParams.get('filter');   // 'missing'
    const sortBy = urlParams.get('sort');            // 'breed' | 'gender'
    const locationFilter = urlParams.get('location'); // 'usa'

    function isMissingInfo(d) {
      const req = [d.breed, d.dogname, d.gender, d.dob, d.microchip, d.father, d.mother];
      return req.some(v => v === null || v === undefined || v === '');
    }

    function applyClientFilters(dogs) {
      let result = dogs;
      if (statusFilter) result = result.filter(d => d.status === statusFilter);
      if (missingFilter === 'missing') result = result.filter(isMissingInfo);
      if (locationFilter === 'usa') result = result.filter(d => (d.comment || '').toLowerCase().includes('location: usa'));
      if (sortBy === 'breed') result = [...result].sort((a, b) => (a.breed || '').localeCompare(b.breed || ''));
      if (sortBy === 'gender') result = [...result].sort((a, b) => (a.gender || '').localeCompare(b.gender || ''));
      return result;
    }

    function renderFilterChip() {
      const holder = document.getElementById('filterChipHolder');
      let label = null;
      if (statusFilter === 'active') label = 'Showing: Active Dogs';
      else if (statusFilter === 'deceased') label = 'Showing: Deceased Dogs';
      else if (missingFilter === 'missing') label = 'Showing: Dogs With Missing Information';
      else if (locationFilter === 'usa') label = 'Showing: Dogs in USA';
      else if (sortBy === 'breed') label = 'Sorted by: Breed';
      else if (sortBy === 'gender') label = 'Sorted by: Gender';

      if (!label) { holder.innerHTML = ''; return; }
      holder.innerHTML = `
        <div class="filter-chip">
          <i data-feather="filter" style="width:14px;height:14px;"></i> ${label}
          <button onclick="window.location.href='home.html'" title="Clear filter">
            <i data-feather="x" style="width:14px;height:14px;"></i>
          </button>
        </div>`;
      feather.replace();
    }

    async function loadDogs(search = '') {
      try {
        const q = search ? `?search=${encodeURIComponent(search)}` : '';
        const data = await apiRequest(`/dogs${q}`);
        renderDogs(applyClientFilters(data.dogs));
      } catch (err) {
        alert(err.message);
      }
    }

    function renderDogs(dogs) {
      tbody.innerHTML = '';
      emptyState.style.display = dogs.length ? 'none' : 'block';
      for (const d of dogs) {
        const tr = document.createElement('tr');
        const statusPill = `<span class="status-pill ${d.status}">${d.status}</span>`;
        const photoCell = d.photo
          ? `<img src="${d.photo}" alt="" style="width:34px; height:34px; border-radius:50%; object-fit:cover;">`
          : `<div style="width:34px; height:34px; border-radius:50%; background:var(--blue-soft); display:flex; align-items:center; justify-content:center;"><i data-feather="camera-off" style="width:14px; height:14px; color:var(--blue);"></i></div>`;
        tr.innerHTML = `
          <td>${photoCell}</td>
          <td>${d.dogid}</td><td>${d.breed || ''}</td><td>${d.dogname || ''}</td>
          <td>${d.nickname || ''}</td><td>${d.gender || ''}</td>
          <td>${d.dob ? new Date(d.dob).toLocaleDateString() : ''}</td>
          <td>${d.microchip || ''}</td><td>${d.father || ''}</td><td>${d.mother || ''}</td>
          <td class="truncate-cell" title="Click row to view full details">${d.comment || ''}</td>
          <td>${statusPill}</td>
          <td class="actions">
            <button class="btn btn-secondary" data-view="${d.dogid}"><i data-feather="eye"></i></button>
            ${user.adminrights ? `<button class="btn btn-secondary" data-edit="${d.dogid}"><i data-feather="edit-2"></i></button>
            <button class="btn btn-danger" data-delete="${d.dogid}"><i data-feather="trash-2"></i></button>` : ''}
          </td>`;
        tbody.appendChild(tr);
        tr.dataset.dog = JSON.stringify(d);
      }
      feather.replace();
      syncTableScrollTop();
    }

    // Keeps a thin scrollbar above the table in sync with the table's own
    // horizontal scroll, so you don't have to scroll all the way down first.
    const tableWrap = document.getElementById('tableWrap');
    const tableScrollTop = document.getElementById('tableScrollTop');
    const tableScrollTopInner = document.getElementById('tableScrollTopInner');
    let syncingScroll = false;

    function syncTableScrollTop() {
      const table = tableWrap.querySelector('table');
      if (!table) return;
      tableScrollTopInner.style.width = table.scrollWidth + 'px';
    }
    tableScrollTop.addEventListener('scroll', () => {
      if (syncingScroll) return;
      syncingScroll = true;
      tableWrap.scrollLeft = tableScrollTop.scrollLeft;
      syncingScroll = false;
    });
    tableWrap.addEventListener('scroll', () => {
      if (syncingScroll) return;
      syncingScroll = true;
      tableScrollTop.scrollLeft = tableWrap.scrollLeft;
      syncingScroll = false;
    });
    window.addEventListener('resize', syncTableScrollTop);

    document.getElementById('searchInput').addEventListener('input', (e) => loadDogs(e.target.value));

    const photoInput = document.getElementById('photoInput');
    const photoPreview = document.getElementById('photoPreview');
    const photoPlaceholder = document.getElementById('photoPlaceholder');
    const photoData = document.getElementById('photoData');
    const photoRemoveWrap = document.getElementById('photoRemoveWrap');
    const photoRemoveBtn = document.getElementById('photoRemoveBtn');
    const photoAdjustBtn = document.getElementById('photoAdjustBtn');
    const cropWrap = document.getElementById('cropWrap');
    const cropStage = document.getElementById('cropStage');
    const cropImage = document.getElementById('cropImage');
    const cropZoom = document.getElementById('cropZoom');
    const cropCancelBtn = document.getElementById('cropCancelBtn');
    const cropApplyBtn = document.getElementById('cropApplyBtn');
    const CROP_SIZE = 220;

    function setPhotoPreview(dataUrl) {
      if (dataUrl) {
        photoPreview.src = dataUrl;
        photoPreview.style.display = 'block';
        photoPlaceholder.style.display = 'none';
        photoRemoveWrap.style.display = 'flex';
        photoData.value = dataUrl;
      } else {
        photoPreview.src = '';
        photoPreview.style.display = 'none';
        photoPlaceholder.style.display = 'flex';
        photoRemoveWrap.style.display = 'none';
        photoData.value = '';
      }
    }

    // ---- Crop / reposition tool state ----
    let crop = { naturalW: 0, naturalH: 0, minScale: 1, scale: 1, x: 0, y: 0 };
    let dragging = false, dragStartX = 0, dragStartY = 0, dragOrigX = 0, dragOrigY = 0;

    function clampOffset() {
      const dispW = crop.naturalW * crop.scale;
      const dispH = crop.naturalH * crop.scale;
      const minX = Math.min(0, CROP_SIZE - dispW);
      const minY = Math.min(0, CROP_SIZE - dispH);
      crop.x = Math.max(minX, Math.min(0, crop.x));
      crop.y = Math.max(minY, Math.min(0, crop.y));
    }

    function applyCropTransform() {
      cropImage.style.width = (crop.naturalW * crop.scale) + 'px';
      cropImage.style.height = (crop.naturalH * crop.scale) + 'px';
      cropImage.style.transform = `translate(${crop.x}px, ${crop.y}px)`;
    }

    function openCropper(src) {
      cropImage.onload = () => {
        crop.naturalW = cropImage.naturalWidth;
        crop.naturalH = cropImage.naturalHeight;
        crop.minScale = Math.max(CROP_SIZE / crop.naturalW, CROP_SIZE / crop.naturalH);
        crop.scale = crop.minScale;
        crop.x = (CROP_SIZE - crop.naturalW * crop.scale) / 2;
        crop.y = (CROP_SIZE - crop.naturalH * crop.scale) / 2;
        clampOffset();
        cropZoom.value = 100;
        applyCropTransform();
        cropWrap.style.display = 'block';
      };
      cropImage.src = src;
    }

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) {
        alert('Please choose an image smaller than 8MB.');
        photoInput.value = '';
        return;
      }
      const reader = new FileReader();
      reader.onload = () => openCropper(reader.result);
      reader.readAsDataURL(file);
    });

    photoPreview.addEventListener('click', () => {
      if (photoData.value) openCropper(photoData.value);
    });
    photoAdjustBtn.addEventListener('click', () => {
      if (photoData.value) openCropper(photoData.value);
    });

    cropZoom.addEventListener('input', () => {
      const centerX = CROP_SIZE / 2, centerY = CROP_SIZE / 2;
      const imgCenterX = (centerX - crop.x) / crop.scale;
      const imgCenterY = (centerY - crop.y) / crop.scale;
      crop.scale = crop.minScale * (cropZoom.value / 100);
      crop.x = centerX - imgCenterX * crop.scale;
      crop.y = centerY - imgCenterY * crop.scale;
      clampOffset();
      applyCropTransform();
    });

    function startDrag(clientX, clientY) {
      dragging = true;
      dragStartX = clientX; dragStartY = clientY;
      dragOrigX = crop.x; dragOrigY = crop.y;
      cropStage.style.cursor = 'grabbing';
    }
    function moveDrag(clientX, clientY) {
      if (!dragging) return;
      crop.x = dragOrigX + (clientX - dragStartX);
      crop.y = dragOrigY + (clientY - dragStartY);
      clampOffset();
      applyCropTransform();
    }
    function endDrag() { dragging = false; cropStage.style.cursor = 'grab'; }

    cropStage.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);
    cropStage.addEventListener('touchstart', (e) => {
      const t = e.touches[0]; startDrag(t.clientX, t.clientY);
    }, { passive: true });
    cropStage.addEventListener('touchmove', (e) => {
      const t = e.touches[0]; moveDrag(t.clientX, t.clientY);
    }, { passive: true });
    cropStage.addEventListener('touchend', endDrag);

    cropCancelBtn.addEventListener('click', () => {
      cropWrap.style.display = 'none';
      photoInput.value = '';
    });

    cropApplyBtn.addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      canvas.width = CROP_SIZE;
      canvas.height = CROP_SIZE;
      const ctx = canvas.getContext('2d');
      const srcX = -crop.x / crop.scale;
      const srcY = -crop.y / crop.scale;
      const srcW = CROP_SIZE / crop.scale;
      const srcH = CROP_SIZE / crop.scale;
      ctx.drawImage(cropImage, srcX, srcY, srcW, srcH, 0, 0, CROP_SIZE, CROP_SIZE);
      const finalDataUrl = canvas.toDataURL('image/jpeg', 0.85);
      setPhotoPreview(finalDataUrl);
      cropWrap.style.display = 'none';
      photoInput.value = '';
    });

    photoRemoveBtn.addEventListener('click', () => {
      photoInput.value = '';
      cropWrap.style.display = 'none';
      setPhotoPreview(null);
    });

    function openModal(dog = null) {
      dogForm.reset();
      cropWrap.style.display = 'none';
      setPhotoPreview(dog && dog.photo ? dog.photo : null);
      document.getElementById('dogId').value = dog ? dog.dogid : '';
      if (dog) {
        document.getElementById('breed').value = dog.breed || '';
        document.getElementById('dogname').value = dog.dogname || '';
        document.getElementById('nickname').value = dog.nickname || '';
        document.getElementById('gender').value = dog.gender || '';
        document.getElementById('dob').value = dog.dob ? dog.dob.substring(0, 10) : '';
        document.getElementById('microchip').value = dog.microchip || '';
        document.getElementById('father').value = dog.father || '';
        document.getElementById('mother').value = dog.mother || '';
        document.getElementById('status').value = dog.status || 'active';
        document.getElementById('dispositionDate').value = dog.disposition_date ? dog.disposition_date.substring(0, 10) : '';
        document.getElementById('saleAmount').value = dog.sale_amount !== null && dog.sale_amount !== undefined
          ? formatAedAmount(dog.sale_amount) : '';
        document.getElementById('dispositionName').value = dog.disposition_contact_name || '';
        document.getElementById('dispositionAddress').value = dog.disposition_contact_address || '';
        document.getElementById('dispositionContact').value = dog.disposition_contact_details || '';
        document.getElementById('comment').value = dog.comment || '';
      }
      updateDispositionFields();
      modalOverlay.classList.add('show');
      feather.replace();
      setTimeout(() => document.getElementById('breed').focus(), 50);
    }
    function closeModal() { modalOverlay.classList.remove('show'); }

    document.getElementById('addBtn').addEventListener('click', () => openModal());
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    const viewModalOverlay = document.getElementById('viewModalOverlay');

    function openViewModal(dog) {
      const photoHtml = dog.photo
        ? `<img src="${dog.photo}" alt="">`
        : `<div class="photo-placeholder"><i data-feather="camera-off" style="width:32px; height:32px; color:#fff; opacity:0.7;"></i></div>`;
      const rows = [
        ['DogID', dog.dogid],
        ['Breed', dog.breed],
        ['Dog Name', dog.dogname],
        ['Nick Name', dog.nickname],
        ['Gender', dog.gender],
        ['Date of Birth', dog.dob ? new Date(dog.dob).toLocaleDateString() : ''],
        ['Microchip Number', dog.microchip],
        ['Father', dog.father],
        ['Mother', dog.mother],
        ['Status', dog.status]
      ];
      if (dog.status === 'sold' || dog.status === 'adopted') {
        const person = dog.status === 'sold' ? 'Buyer' : 'Adopter';
        rows.push(
          [dog.status === 'sold' ? 'Date Sold' : 'Date Adopted', dog.disposition_date ? new Date(dog.disposition_date).toLocaleDateString() : ''],
          ...(dog.status === 'sold' ? [['Unit Price', formatAedAmount(dog.sale_amount)]] : []),
          [`${person}'s Name`, dog.disposition_contact_name],
          [`${person}'s Address`, dog.disposition_contact_address],
          [`${person}'s Contact Details`, dog.disposition_contact_details]
        );
      }
      document.getElementById('viewPhotoCol').innerHTML = photoHtml;
      document.getElementById('viewFieldsCol').innerHTML = rows.map(([label, value]) => `
        <div class="field">
          <label>${label}</label>
          <div style="background:rgba(255,255,255,0.92); border-radius:8px; padding:10px 14px; font-size:14px; color:var(--text); min-height:20px;">
            ${value || value === 0 ? value : '<span style="opacity:0.5;">—</span>'}
          </div>
        </div>
      `).join('') + `
        <div class="field">
          <label>Comments</label>
          <div style="background:rgba(255,255,255,0.92); border-radius:8px; padding:10px 14px; font-size:14px; color:var(--text); white-space:pre-wrap; max-height:220px; overflow-y:auto; min-height:20px;">
            ${dog.comment ? dog.comment.replace(/</g, '&lt;') : '<span style="opacity:0.5;">No comments</span>'}
          </div>
        </div>
      `;
      viewModalOverlay.classList.add('show');
      feather.replace();
    }
    document.getElementById('viewCloseBtn').addEventListener('click', () => viewModalOverlay.classList.remove('show'));

    tbody.addEventListener('click', (e) => {
      const editBtn = e.target.closest('[data-edit]');
      const delBtn = e.target.closest('[data-delete]');
      const viewBtn = e.target.closest('[data-view]');

      if (editBtn) {
        const dog = JSON.parse(editBtn.closest('tr').dataset.dog);
        openModal(dog);
        return;
      }
      if (delBtn) { deleteDog(delBtn.getAttribute('data-delete')); return; }
      if (viewBtn) {
        const dog = JSON.parse(viewBtn.closest('tr').dataset.dog);
        openViewModal(dog);
        return;
      }
      const tr = e.target.closest('tr');
      if (tr && !e.target.closest('button')) {
        openViewModal(JSON.parse(tr.dataset.dog));
      }
    });

    async function deleteDog(id) {
      if (!confirm('Delete this dog record?')) return;
      try {
        await apiRequest(`/dogs/${id}`, { method: 'DELETE' });
        loadDogs(document.getElementById('searchInput').value);
      } catch (err) {
        alert(err.message);
      }
    }

    dogForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('dogId').value;
      const body = {
        breed: document.getElementById('breed').value,
        dogname: document.getElementById('dogname').value,
        nickname: document.getElementById('nickname').value,
        gender: document.getElementById('gender').value,
        dob: document.getElementById('dob').value || null,
        microchip: document.getElementById('microchip').value,
        father: document.getElementById('father').value,
        mother: document.getElementById('mother').value,
        status: document.getElementById('status').value,
        disposition_date: document.getElementById('dispositionDate').value || null,
        sale_amount: document.getElementById('saleAmount').value.replace(/[^0-9.]/g, ''),
        disposition_contact_name: document.getElementById('dispositionName').value,
        disposition_contact_address: document.getElementById('dispositionAddress').value,
        disposition_contact_details: document.getElementById('dispositionContact').value,
        comment: document.getElementById('comment').value,
        photo: document.getElementById('photoData').value || null
      };
      try {
        if (id) {
          await apiRequest(`/dogs/${id}`, { method: 'PUT', body });
        } else {
          await apiRequest('/dogs', { method: 'POST', body });
        }
        closeModal();
        loadDogs(document.getElementById('searchInput').value);
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('saleAmount').addEventListener('blur', (e) => {
      if (e.target.value.trim()) e.target.value = formatAedAmount(e.target.value);
    });

    renderFilterChip();
    loadDogs();
    feather.replace();
  </script>
</body>
</html>
