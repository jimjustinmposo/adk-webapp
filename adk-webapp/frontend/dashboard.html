<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alpha Delta Kennel — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<!-- Feather Icons -->
<script src="https://unpkg.com/feather-icons"></script>
</head>

<body>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-profile fade-in">
        <div class="sidebar-avatar">
          <i data-feather="user"></i>
        </div>
        <div>
          <div class="sidebar-name" id="sidebarName">Welcome</div>
          <div class="sidebar-role" id="sidebarRole"></div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="active">
          <i data-feather="grid"></i> Dashboard
        </a>
        <a href="home.html">
          <i data-feather="list"></i> Dogs
        </a>
        <a href="sold.html">
          <i data-feather="tag"></i> Sold
        </a>
        <a href="adopted.html">
          <i data-feather="heart"></i> Adopted
        </a>
      </nav>

      <button class="sidebar-logout" onclick="logout()">
        <i data-feather="log-out"></i> Log out
      </button>
    </aside>

    <!-- Main -->
    <main class="main fade-in-up">
      <h2 class="page-title">
        <i data-feather="activity"></i> Dashboard Overview
      </h2>

      <div class="stat-grid" id="statGrid">

        <a class="stat-card pop" href="home.html">
          <i class="stat-icon" data-feather="hash"></i>
          <div class="stat-label">Total Number of Dogs</div>
          <div class="stat-value" id="statTotal">—</div>
        </a>

        <a class="stat-card pop" href="home.html?status=active">
          <i class="stat-icon" data-feather="heart"></i>
          <div class="stat-label">Active Dogs</div>
          <div class="stat-value" id="statActive">—</div>
        </a>

        <a class="stat-card pop" href="home.html?sort=breed">
          <i class="stat-icon" data-feather="layers"></i>
          <div class="stat-label">Dogs by Breed</div>
          <div class="stat-value" id="statBreed">—</div>
        </a>

        <a class="stat-card pop" href="home.html?sort=gender">
          <i class="stat-icon" data-feather="users"></i>
          <div class="stat-label">Male vs Female</div>
          <div class="stat-value" id="statGender">—</div>
        </a>

        <a class="stat-card pop" href="home.html?status=deceased">
          <i class="stat-icon" data-feather="x-circle"></i>
          <div class="stat-label">Deceased Dogs</div>
          <div class="stat-value" id="statDeceased">—</div>
        </a>

        <a class="stat-card pop" href="home.html?filter=missing">
          <i class="stat-icon" data-feather="alert-triangle"></i>
          <div class="stat-label">Missing Information</div>
          <div class="stat-value" id="statMissing">—</div>
        </a>

        <a class="stat-card pop" href="home.html?location=usa">
          <i class="stat-icon" data-feather="flag"></i>
          <div class="stat-label">Dogs in USA</div>
          <div class="stat-value" id="statUSA">—</div>
        </a>

      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireLogin();
    renderSidebarProfile();

    (async () => {
      try {
        const stats = await apiRequest('/dashboard/stats');

        document.getElementById('statTotal').textContent = stats.totalDogs;
        document.getElementById('statActive').textContent = stats.activeDogs;
        document.getElementById('statDeceased').textContent = stats.deceasedDogs;
        document.getElementById('statMissing').textContent = stats.dogsWithMissingInfo;
        document.getElementById('statUSA').textContent = stats.dogsInUSA;

        const breedText = stats.dogsByBreed.length
          ? stats.dogsByBreed.map(b => `${b.breed}: ${b.count}`).join(' · ')
          : '0';
        document.getElementById('statBreed').textContent = stats.dogsByBreed.length || 0;
        document.getElementById('statBreed').title = breedText;

        const male = stats.dogsByGender.find(g => /male/i.test(g.gender) && !/female/i.test(g.gender));
        const female = stats.dogsByGender.find(g => /female/i.test(g.gender));
        document.getElementById('statGender').textContent =
          `${male ? male.count : 0} / ${female ? female.count : 0}`;

      } catch (err) {
        alert(err.message);
      }
    })();

    // Activate icons
    feather.replace();
  </script>
</body>
</html>
