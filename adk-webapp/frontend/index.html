<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alpha Delta Kennel — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <img src="images/logo.jpeg" alt="Alpha Delta Kennel" class="auth-logo-img">
      <h1>Welcome to Alpha Delta Kennel</h1>
      <p class="subtitle">Dogs Information</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
      </form>

      <div class="link-row">
        <a href="create-account-pass.html">Create new account?</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          auth: false,
          body: {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          }
        });
        localStorage.setItem('adk_token', data.token);
        localStorage.setItem('adk_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add('show');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
